<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category | you knoowww</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070b19;
            color: #f7f8ff;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVIGATION */

        nav {
            height: 76px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid rgba(255,255,255,0.09);
            background: rgba(7,11,25,0.78);

            backdrop-filter: blur(15px);

            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #75cfff,
                #a978ff,
                #f18bdc
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            color: #cbd2e5;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: white;
        }

        /* PAGE */

        .page {
            width: 86%;
            max-width: 1100px;
            margin: auto;
            padding: 55px 0 90px;
        }

        .back {
            display: inline-block;
            color: #9da7c0;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .back:hover {
            color: white;
        }

        /* HERO */

        .hero {
            margin-bottom: 45px;
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 50px;

            background: rgba(126,105,255,0.09);
            border: 1px solid rgba(167,139,250,0.30);

            color: #c6b5ff;
            font-size: 12px;
            letter-spacing: 1px;

            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(42px, 6vw, 65px);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 18px;
        }

        .hero p {
            color: #9da7c0;
            max-width: 650px;
            font-size: 16px;
            line-height: 1.7;
        }

        /* PRODUCT AREA */

        .products {
            padding: 35px;

            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.09);

            background:
                linear-gradient(
                    145deg,
                    rgba(79,140,255,0.08),
                    rgba(139,92,246,0.05)
                );

            text-align: center;
        }

        .products h2 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .products p {
            color: #9da7c0;
        }

        /* FOOTER */

        footer {
            padding: 30px 7%;
            border-top: 1px solid rgba(255,255,255,0.09);

            text-align: center;

            color: #737e97;
            font-size: 12px;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .page {
                width: 90%;
            }

            .nav-links {
                gap: 14px;
            }

            .nav-links a {
                font-size: 12px;
            }

        }

    </style>

</head>

<body>

    <nav>

        <a href="index.html" class="logo">
            you knoowww
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="index.html#why">
                Why us?
            </a>

        </div>

    </nav>


    <main class="page">

        <a href="categories.html" class="back">
            ← Back to Categories
        </a>


        <section class="hero">

            <div class="badge">
                PRODUCT CATEGORY
            </div>

            <h1>
                Footwear
            </h1>

            <p>
                Discover shoes, sneakers and everyday footwear
                information before making your choice.
            </p>

        </section>


        <section class="products">

            <h2>
                Products
            </h2>

            <p>
                Products will appear here as the library grows.
            </p>

        </section>

    </main>


    <footer>
        © 2026 you knoowww · Discover · Compare · Choose
    </footer>

</body>

</html>
