<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>You Knoowww — Footwear Collection</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f6f6;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 28px 6%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .count {
      font-size: 14px;
      opacity: .75;
    }

    .controls {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input,
    select {
      border: none;
      outline: none;
      border-radius: 10px;
      padding: 13px 15px;
      font-size: 14px;
      background: white;
    }

    #search {
      flex: 1;
      min-width: 230px;
    }

    main {
      width: 90%;
      max-width: 1450px;
      margin: 35px auto;
    }

    .status {
      margin-bottom: 22px;
      font-size: 14px;
      color: #666;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
    }

    .image-box {
      width: 100%;
      height: 280px;
      background: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 15px;
    }

    .no-image {
      text-align: center;
      color: #777;
      padding: 25px;
      font-size: 13px;
    }

    .product-info {
      padding: 18px;
    }

    .number {
      font-size: 12px;
      color: #888;
      margin-bottom: 7px;
    }

    .brand {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #777;
      margin-bottom: 7px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      min-height: 40px;
    }

    .view-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .view-btn:hover {
      background: #333;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #777;
      display: none;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 95%;
      max-width: 850px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 20px;
      top: 15px;
      border: none;
      background: #eee;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .modal-image {
      width: 100%;
      height: 400px;
      background: #f4f4f4;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 20px;
    }

    .modal h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .modal-brand {
      color: #777;
      margin-bottom: 20px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 25px;
    }

    .detail {
      background: #f6f6f6;
      padding: 15px;
      border-radius: 12px;
    }

    .detail strong {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .detail span {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 1100px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 750px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .image-box {
        height: 230px;
      }
    }

    @media (max-width: 500px) {
      .products-grid {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .modal-image {
        height: 280px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-top">
    <div>
      <div class="logo">YOU KNOOWWW</div>
      <div class="count">Premium Footwear Collection</div>
    </div>

    <div class="count" id="totalCount">
      0 Products
    </div>
  </div>

  <div class="controls">
    <input
      id="search"
      type="search"
      placeholder="Search shoes, brands or models..."
    >

    <select id="brandFilter">
      <option value="all">All Brands</option>
    </select>

    <select id="sort">
      <option value="sequence">Original Sequence</option>
      <option value="az">A–Z</option>
      <option value="za">Z–A</option>
    </select>
  </div>
</header>


<main>

  <div class="status" id="status">
    Loading footwear collection...
  </div>

  <div class="products-grid" id="productsGrid"></div>

  <div class="empty" id="empty">
    No products found.
  </div>

</main>


<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <div class="modal-image" id="modalImage"></div>

    <h2 id="modalName"></h2>

    <div class="modal-brand" id="modalBrand"></div>

    <p id="modalDescription"></p>

    <div class="details">

      <div class="detail">
        <strong>Best For</strong>
        <span id="modalBestFor"></span>
      </div>

      <div class="detail">
        <strong>Material</strong>
        <span id="modalMaterial"></span>
      </div>

      <div class="detail">
        <strong>Key Features</strong>
        <span id="modalFeatures"></span>
      </div>

      <div class="detail">
        <strong>Things To Consider</strong>
        <span id="modalConsider"></span>
      </div>

    </div>

  </div>

</div>


<!-- YOUR ORIGINAL 100 PRODUCTS -->
<script src="products(1).js"></script>

<script>
  /*
    The original file declares:
    const products = [...]
    
    We expose it to the additions file.
  */
  window.products = products;
</script>


<!-- YOUR 166 NEW PRODUCTS -->
<script src="footwear166_additions.js"></script>


<script>

  let allProducts = window.products || [];
  let displayedProducts = [...allProducts];

  /*
    SAFETY CHECK
    The website must contain exactly 266 products.
  */

  if (allProducts.length !== 266) {
    console.error(
      "Expected 266 products but found:",
      allProducts.length
    );
  }

  /*
    Give every product its website sequence number.
  */

  allProducts = allProducts.map((product, index) => ({
    ...product,
    sequence: index + 1
  }));

  displayedProducts = [...allProducts];

  const grid = document.getElementById("productsGrid");
  const search = document.getElementById("search");
  const brandFilter = document.getElementById("brandFilter");
  const sort = document.getElementById("sort");
  const status = document.getElementById("status");
  const empty = document.getElementById("empty");
  const totalCount = document.getElementById("totalCount");


  /*
    BRAND FILTER
  */

  const brands = [
    ...new Set(
      allProducts
        .map(product => product.brand)
        .filter(Boolean)
    )
  ].sort();

  brands.forEach(brand => {

    const option = document.createElement("option");

    option.value = brand;
    option.textContent = brand;

    brandFilter.appendChild(option);

  });


  /*
    IMAGE SAFETY
    Never replace a missing shoe with a random shoe.
  */

  function createImage(product) {

    const box = document.createElement("div");
    box.className = "image-box";

    if (
      product.image &&
      typeof product.image === "string" &&
      product.image.trim() !== ""
    ) {

      const img = document.createElement("img");

      img.src = product.image.trim();

      img.alt = `${product.name} — official product image`;

      img.loading = "lazy";

      img.referrerPolicy = "no-referrer";

      img.onerror = function() {

        box.innerHTML = `
          <div class="no-image">
            Exact product image unavailable.
          </div>
        `;

      };

      box.appendChild(img);

    } else {

      box.innerHTML = `
        <div class="no-image">
          Exact product image not added yet.
        </div>
      `;

    }

    return box;
  }


  /*
    RENDER PRODUCTS
  */

  function renderProducts(productsToShow) {

    grid.innerHTML = "";

    totalCount.textContent =
      `${productsToShow.length} Products`;

    status.textContent =
      `Showing ${productsToShow.length} of ${allProducts.length} products`;

    if (productsToShow.length === 0) {

      empty.style.display = "block";

      return;

    }

    empty.style.display = "none";


    productsToShow.forEach(product => {

      const card = document.createElement("article");

      card.className = "product-card";


      card.appendChild(
        createImage(product)
      );


      const info = document.createElement("div");

      info.className = "product-info";


      const number = document.createElement("div");

      number.className = "number";

      number.textContent =
        `#${String(product.sequence).padStart(3, "0")}`;


      const brand = document.createElement("div");

      brand.className = "brand";

      brand.textContent =
        product.brand || "Brand";


      const name = document.createElement("div");

      name.className = "product-name";

      name.textContent =
        product.name || "Unnamed Product";


      const description = document.createElement("div");

      description.className = "description";

      description.textContent =
        product.description || "";


      const button = document.createElement("button");

      button.className = "view-btn";

      button.textContent = "View Product";

      button.onclick = () =>
        openModal(product);


      info.appendChild(number);
      info.appendChild(brand);
      info.appendChild(name);
      info.appendChild(description);
      info.appendChild(button);

      card.appendChild(info);

      grid.appendChild(card);

    });

  }


  /*
    SEARCH + FILTER
  */

  function applyFilters() {

    const searchText =
      search.value.trim().toLowerCase();

    const selectedBrand =
      brandFilter.value;

    displayedProducts =
      allProducts.filter(product => {

        const matchesSearch =
          !searchText ||
          product.name.toLowerCase().includes(searchText) ||
          product.brand.toLowerCase().includes(searchText) ||
          (product.description || "")
            .toLowerCase()
            .includes(searchText);

        const matchesBrand =
          selectedBrand === "all" ||
          product.brand === selectedBrand;

        return matchesSearch && matchesBrand;

      });


    if (sort.value === "az") {

      displayedProducts.sort((a, b) =>
        a.name.localeCompare(b.name)
      );

    }

    else if (sort.value === "za") {

      displayedProducts.sort((a, b) =>
        b.name.localeCompare(a.name)
      );

    }

    else {

      displayedProducts.sort(
        (a, b) => a.sequence - b.sequence
      );

    }


    renderProducts(displayedProducts);

  }


  search.addEventListener(
    "input",
    applyFilters
  );

  brandFilter.addEventListener(
    "change",
    applyFilters
  );

  sort.addEventListener(
    "change",
    applyFilters
  );


  /*
    PRODUCT MODAL
  */

  function openModal(product) {

    const modal =
      document.getElementById("modal");

    const modalImage =
      document.getElementById("modalImage");


    modalImage.innerHTML = "";


    if (
      product.image &&
      product.image.trim() !== ""
    ) {

      const img =
        document.createElement("img");

      img.src = product.image;

      img.alt =
        `${product.name} exact product image`;

      img.referrerPolicy =
        "no-referrer";

      img.onerror = function() {

        modalImage.innerHTML = `
          <div class="no-image">
            Exact product image unavailable.
          </div>
        `;

      };

      modalImage.appendChild(img);

    } else {

      modalImage.innerHTML = `
        <div class="no-image">
          Exact product image not added yet.
        </div>
      `;

    }


    document.getElementById("modalName")
      .textContent =
      `#${String(product.sequence).padStart(3, "0")} — ${product.name}`;


    document.getElementById("modalBrand")
      .textContent =
      product.brand || "";


    document.getElementById("modalDescription")
      .textContent =
      product.overview ||
      product.description ||
      "";


    document.getElementById("modalBestFor")
      .textContent =
      product.bestFor || "—";


    document.getElementById("modalMaterial")
      .textContent =
      product.material || "—";


    document.getElementById("modalFeatures")
      .textContent =
      Array.isArray(product.keyFeatures)
        ? product.keyFeatures.join(" • ")
        : "—";


    document.getElementById("modalConsider")
      .textContent =
      product.thingsToConsider || "—";


    modal.classList.add("active");

  }


  function closeModal() {

    document
      .getElementById("modal")
      .classList.remove("active");

  }


  document
    .getElementById("modal")
    .addEventListener("click", function(event) {

      if (event.target === this) {
        closeModal();
      }

    });


  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {
        closeModal();
      }

    }
  );


  /*
    FINAL DATABASE CHECK
  */

  const names =
    allProducts.map(
      product => product.name.trim().toLowerCase()
    );

  const uniqueNames =
    new Set(names);


  console.log(
    `YOU KNOOWWW loaded ${allProducts.length} products.`
  );


  console.log(
    `Unique product names: ${uniqueNames.size}`
  );


  if (allProducts.length !== 266) {

    status.textContent =
      `ERROR: Expected 266 products, found ${allProducts.length}.`;

    status.style.color = "red";

  }


  renderProducts(displayedProducts);

</script>

</body>
</html>
